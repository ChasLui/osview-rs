[package]
name = "osview-rs"
version = "0.2.0"
edition = "2021"
rust-version = "1.78"
description = "PLY + CLIP-feature point-cloud viewer: cosine scoring, CLI/GUI render, C SDK and top-k report"
repository = "https://github.com/ChasLui/osview-rs"
license = "MIT"
keywords = ["point-cloud", "ply", "npy", "clip", "visualization"]
categories = ["command-line-utilities", "graphics"]
readme = "README.md"
default-run = "osview-rs"

[lib]
name = "osview_rs"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["cli"]
cli = []
gui = ["dep:minifb"]

[dependencies]
png = "0.18"
minifb = { version = "0.28", optional = true }

[[bin]]
name = "osview-rs"
path = "src/main.rs"

[[bin]]
name = "osview-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = 3